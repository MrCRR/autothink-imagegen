<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  /* ---- MediaStorm design tokens (edit here, every scene inherits) ---- */
  :root {
    --ms-paper: #0A0C0F;
    --ms-ink: #F4F6F8;
    --ms-body: #C9D1DA;
    --ms-mute: #767F8B;
    --ms-amber: #FFB020;
    --ms-cyan: #38E1FF;
    --ms-red: #FF3B30;
    --ms-line: rgba(255,255,255,.14);
    --ms-quiet: #9AA3AE;
    --ms-dim: #5A636E;
    --ms-press: #161C24;
    --ms-press-warm: #1C1710;
    --ms-flash: #EAF6FF;
    --ms-font-cn: "Noto Sans SC";
    --ms-font-num: "Oswald";
  }
  @font-face { font-family: "Noto Sans SC"; src: url("assets/fonts/NotoSansSC-VF.woff2") format("woff2");
               font-weight: 100 900; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ms-paper); }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">

  <div id="s01-host" data-composition-id="s01-hook" data-composition-src="compositions/s01-hook.html"
       data-start="0" data-duration="4" data-track-index="0" data-width="1920" data-height="1080"></div>
  <div id="s02-host" data-composition-id="s02-promise" data-composition-src="compositions/s02-promise.html"
       data-start="4" data-duration="4" data-track-index="0" data-width="1920" data-height="1080"></div>
  <div id="s03-host" data-composition-id="s03-chapter" data-composition-src="compositions/s03-chapter.html"
       data-start="8" data-duration="3.5" data-track-index="0" data-width="1920" data-height="1080"></div>
  <div id="s04-host" data-composition-id="s04-data" data-composition-src="compositions/s04-data.html"
       data-start="11.5" data-duration="7" data-track-index="0" data-width="1920" data-height="1080"></div>
  <div id="s05-host" data-composition-id="s05-compare" data-composition-src="compositions/s05-compare.html"
       data-start="18.5" data-duration="6.5" data-track-index="0" data-width="1920" data-height="1080"></div>
  <div id="s06-host" data-composition-id="s06-outro" data-composition-src="compositions/s06-outro.html"
       data-start="25" data-duration="5" data-track-index="0" data-width="1920" data-height="1080"></div>

  <!-- SFX: one whoosh per cut, impact on the two heaviest hits, click on a number landing -->
  <audio id="sfx-impact-1" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0.30" data-duration="2.12" data-volume="0.34" data-track-index="1"></audio>
  <audio id="sfx-cut-1" class="clip" src="assets/sfx/whoosh.mp3" data-start="3.94" data-duration="0.57" data-volume="0.28" data-track-index="1"></audio>
  <audio id="sfx-cut-2" class="clip" src="assets/sfx/whoosh.mp3" data-start="7.94" data-duration="0.57" data-volume="0.28" data-track-index="1"></audio>
  <audio id="sfx-cut-3" class="clip" src="assets/sfx/whoosh.mp3" data-start="11.44" data-duration="0.57" data-volume="0.28" data-track-index="1"></audio>
  <audio id="sfx-click-1" class="clip" src="assets/sfx/click.mp3" data-start="12.12" data-duration="0.37" data-volume="0.24" data-track-index="2"></audio>
  <audio id="sfx-cut-4" class="clip" src="assets/sfx/whoosh.mp3" data-start="18.44" data-duration="0.57" data-volume="0.28" data-track-index="1"></audio>
  <audio id="sfx-cut-5" class="clip" src="assets/sfx/whoosh.mp3" data-start="24.94" data-duration="0.57" data-volume="0.28" data-track-index="1"></audio>
  <audio id="sfx-impact-2" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="25.22" data-duration="2.12" data-volume="0.3" data-track-index="2"></audio>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  window.__timelines["main"] = tl;
</script>
</body>
</html>
