<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  /* ============ 美投君式：两块设计系统 ============ */
  :root {
    /* 深色分析幻灯片（deck） */
    --deck-bg: #14181F;
    --deck-bg-hi: #232B36;
    --deck-bg-lo: #0E1116;
    --deck-ink: #F2F4F7;
    --deck-body: #C6CDD6;
    --deck-mute: #8B95A3;
    --deck-panel: rgba(255,255,255,.045);
    --deck-line: rgba(255,255,255,.14);
    /* 语义色：红=风险/下跌，绿=机会/上涨，金=中性强调/行动 */
    --mt-red: #E5342A;
    --mt-green: #35C46B;
    --mt-gold: #F5B02E;
    /* 白板手绘（whiteboard） */
    --paper: #F7F5EF;
    --paper-ink-soft: #6B6B6B;
    --pen-body: #263140;
    --pen-metal: #8FA0B4;
    --pen-grip: #C8D2DC;
    --deck-hi-2: #222A35;
    --deck-faint: #6C7684;
    --ink: #232323;
    --mark-red: #D8352A;
    --mark-green: #1F9D55;
    --mark-blue: #2F6FD0;
    /* 字体 */
    --font-cn: "Noto Sans SC";
    --font-hand: "ZCOOL KuaiLe";
    --font-num: "Oswald";
  }
  @font-face { font-family: "Noto Sans SC"; src: url("assets/fonts/NotoSansSC-VF.woff2") format("woff2");
               font-weight: 100 900; font-display: block; }
  @font-face { font-family: "ZCOOL KuaiLe"; src: url("assets/fonts/ZCOOLKuaiLe.woff2") format("woff2");
               font-weight: 400; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--deck-bg); }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }

  /* 全片叠加：水印 + 字幕 */
  .wm { position: absolute; right: 56px; top: 46px; font-family: var(--font-cn); font-size: 28px;
        font-weight: 700; letter-spacing: .12em; color: rgba(255,255,255,.46); z-index: 90; }
  .wm.on-paper { color: rgba(35,35,35,.42); }
  #subs-root .sub-group { position: absolute; left: 0; right: 0; bottom: 96px; text-align: center;
        font-family: var(--font-cn); font-size: 46px; font-weight: 700; color: #FFFFFF;
        paint-order: stroke fill; -webkit-text-stroke: 5px rgba(0,0,0,.85);
        letter-spacing: .01em; line-height: 1.25; z-index: 30; }
  #subs-root .sub-group.dark { color: #232323; -webkit-text-stroke: 5px rgba(247,245,239,.92); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="43" data-width="1920" data-height="1080">

  <div id="s01-host" data-composition-id="s01-title" data-composition-src="compositions/s01-title.html"
